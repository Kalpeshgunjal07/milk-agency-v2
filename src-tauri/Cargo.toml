[package]
name = "milk-agency-v2"
version = "0.1.0"
description = "Milk Agency Management System"
authors = ["Kalpesh"]
license = "MIT"
repository = "https://example.com/milk-agency-v2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
keyring = "2.3"
